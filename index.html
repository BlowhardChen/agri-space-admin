<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title><%- title %></title>
		<script>
			(function () {
				var defaultPrimaryColor = "#379446";
				var normalizeHexColor = function (color) {
					if (typeof color !== "string") return "";
					var normalizedColor = color.trim();
					if (/^#[0-9a-fA-F]{6}$/.test(normalizedColor)) return normalizedColor;
					if (/^#[0-9a-fA-F]{3}$/.test(normalizedColor)) {
						return (
							"#" +
							normalizedColor
								.slice(1)
								.split("")
								.map(function (item) {
									return item + item;
								})
								.join("")
						);
					}
					return "";
				};
				var parseMaybeString = function (value) {
					return typeof value === "string" ? JSON.parse(value) : value;
				};

				try {
					var persistedState = localStorage.getItem("persist:redux-state");
					var primaryColor = defaultPrimaryColor;

					if (persistedState) {
						var state = parseMaybeString(persistedState);
						var globalState = state && state.global ? parseMaybeString(state.global) : null;
						var persistedPrimary = globalState && globalState.themeConfig && globalState.themeConfig.primary;
						primaryColor = normalizeHexColor(persistedPrimary) || defaultPrimaryColor;
					}

					document.documentElement.style.setProperty("--agri-primary", primaryColor);
				} catch (error) {
					document.documentElement.style.setProperty("--agri-primary", defaultPrimaryColor);
				}
			})();
		</script>
	</head>
	<body>
		<div id="root">
			<style>
				:root {
					--agri-primary: #379446;
				}

				html,
				body,
				#root {
					width: 100%;
					height: 100%;
					padding: 0;
					margin: 0;
					background-color: #ffffff;
				}
				.first-loading-wrap {
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					width: 100%;
					height: 100%;
				}
				.first-loading-wrap > h1 {
					font-size: 128px;
				}
				.first-loading-wrap .loading-wrap {
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 98px;
				}
				.dot {
					position: relative;
					box-sizing: border-box;
					display: inline-block;
					width: 32px;
					height: 32px;
					font-size: 32px;
					transform: rotate(45deg);
					animation: ant-rotate 1.2s infinite linear;
				}
				.dot i {
					position: absolute;
					display: block;
					width: 14px;
					height: 14px;
					background-color: var(--agri-primary, #379446);
					border-radius: 100%;
					opacity: 0.3;
					transform: scale(0.75);
					transform-origin: 50% 50%;
					animation: ant-spin-move 1s infinite linear alternate;
				}
				.dot i:nth-child(1) {
					top: 0;
					left: 0;
				}
				.dot i:nth-child(2) {
					top: 0;
					right: 0;
					animation-delay: 0.4s;
				}
				.dot i:nth-child(3) {
					right: 0;
					bottom: 0;
					animation-delay: 0.8s;
				}
				.dot i:nth-child(4) {
					bottom: 0;
					left: 0;
					animation-delay: 1.2s;
				}
				@keyframes ant-rotate {
					to {
						transform: rotate(405deg);
					}
				}
				@keyframes ant-spin-move {
					to {
						opacity: 1;
					}
				}
			</style>
			<div class="first-loading-wrap">
				<div class="loading-wrap">
					<span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
